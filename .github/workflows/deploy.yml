name: Build image + deploy

on:
  workflow_dispatch:
    # make it possible to trigger action by hand
  push:
    branches: [ "main" ]
  pull_request:
    # do nothing on pull request

jobs:
  # containers must build first
  build-container:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build the containers used for the backend
      env:
        # mock credentials used only once to build the container
        MQTT_USERNAME: ci
        MQTT_PASSWORD: ci
      run: docker compose up -d --build
    - name: Build static frontend files in container
      run: docker build -f src/client/Dockerfile --target build .

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production  # use settings of 'production' environment -> triggers manual review
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # generate a fresh mosquitto password file from the 'production' environment settings,
      # it replaces the one from the checkout and gets rsynced to the server in the next step
      - name: Generate mosquitto password file for deployment
        env:
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          set -e

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e MQTT_USERNAME -e MQTT_PASSWORD \
            -v "$PWD/etc/mosquitto/config:/mosquitto/config" \
            eclipse-mosquitto:latest \
            sh -c 'mosquitto_passwd -c -b /mosquitto/config/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"'

          # mosquitto runs as its own user inside the container and must be able to read the file
          chmod 700 etc/mosquitto/config/passwd

      - name: Build static fronted with vitejs before we transfer it to server
        env:
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          LOGSERVER_CONNECTIONS: ${{ vars.LOGSERVER_CONNECTIONS }}
          MQTTWS_HOST: ${{ vars.MQTTWS_HOST }}
        run: |
            set -e    # fail entire deployment if any one of these commands fails

            # ----------------------------------------------------------------
            # build the client and export it to a staging dir owned by the deploy user
            # we need to do this because the vite frontend is basically static and once
            # generated it can be served by a webserver outside of the container
            # so the container (which runs as root) doesn't need to own the resulting files
            # if we don't do this, the CI deployment task fails because rsync cannot delete
            # the files of the previous deployment without sudo rights (which the deployment user shouldn't have)
            rm -rf src/client/dist.new
            docker build \
              -f src/client/Dockerfile \
              --target export \
              --build-arg VITE_CLIENT_MQTT_CONNECTION_STRING=wss://$MQTT_USERNAME:$MQTT_PASSWORD@$MQTTWS_HOST/mqtt \
              --build-arg VITE_CLIENT_HTTP_CONNECTIONS=$LOGSERVER_CONNECTIONS \
              --output type=local,dest=src/client/dist.new \
              .

            # delete the static frontend from the previous deployment and
            # move the new one over, this way we prevent accidentally serving a half-baked frontend
            rm -rf src/client/dist
            mv src/client/dist.new src/client/dist
            # ----------------------------------------------------------------

      - name: Copy files to server
        uses: burnett01/rsync-deployments@9.0.2
        with:
          switches: -avzr --delete --exclude='.git/' --exclude='etc/mosquitto/data/' --exclude='etc/mosquitto/log/'
          path: ./
          remote_path: ${{ vars.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          envs: MQTT_USERNAME,MQTT_PASSWORD    # exported in the remote shell, docker compose fills them into docker-compose.yml
          script: |
            set -e    # fail entire deployment if any one of these commands fails
            cd ${{ vars.DEPLOY_PATH }}

            docker compose up -d --build --remove-orphans
            # caddy runs with 'admin off' so it can't hot-reload, restart it to pick up Caddyfile changes
            docker compose restart frontend
            docker image prune -f
