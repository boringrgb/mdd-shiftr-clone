name: Build image + deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    # do nothing on pull request

jobs:
  # build the containers first
  build-container:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Docker compose the containers
      run: docker compose up -d --build
    - name: Build client
      run: docker build -f src/client/Dockerfile --target build .

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production  # use settings of 'production' environment -> triggers manual review
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Copy files to server
        uses: burnett01/rsync-deployments@9.0.2
        with:
          switches: -avzr --delete --exclude='.git/' --exclude='src/client/dist/' --exclude='src/client/dist.new/' --exclude='mosquitto/data/' --exclude='mosquitto/log/'
          path: ./
          remote_path: ${{ vars.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}

            # build the client and export it to a staging dir owned by the deploy user
            rm -rf src/client/dist.new
            docker build \
              -f src/client/Dockerfile \
              --target export \
              --build-arg VITE_CLIENT_MQTT_CONNECTION_STRING=ws://username:password@127.0.0.1:8083 \
              --build-arg VITE_CLIENT_HTTP_CONNECTIONS=http://127.0.0.1:9999 \
              --output type=local,dest=src/client/dist.new \
              .

            # swap it in for the live dir
            rm -rf src/client/dist
            mv src/client/dist.new src/client/dist

            docker compose up -d --build
            docker image prune -f
