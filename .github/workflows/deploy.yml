name: Build image + deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    # do nothing on pull request

jobs:
  # build the containers first
  build-container:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Docker compose the containers
      run: docker compose up -d --build

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production  # use settings of 'production' environment -> triggers manual review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./
          remote_path: ${{ vars.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            docker compose up -d --build
            docker image prune -f
