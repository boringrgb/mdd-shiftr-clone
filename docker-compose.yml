
services:
  mosquitto:
    restart: unless-stopped
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883" # mqtt
      - "8083:8083" # mqtt-ws
    volumes:
      - ./etc/mosquitto/config:/mosquitto/config
      - ./etc/mosquitto/data:/mosquitto/data
      - ./etc/mosquitto/log:/mosquitto/log

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/server/Dockerfile
    container_name: backend
    ports:
      - "9999:9999"
    depends_on:
      - mosquitto
    volumes:
      - ./etc/mosquitto/log:/mosquitto/log
    environment:
      - PORT=9999
      - SERVER_MQTT_CONNECTION_STRING=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883
      - SERVER_MQTT_LOG_FILE=/mosquitto/log/mosquitto.log

  frontend:
    image: caddy:2
    restart: unless-stopped
    volumes:
      # mount the directory, not the file: rsync replaces the file (new inode) and a
      # single-file bind mount would keep pointing at the old one
      - ./etc/caddy:/etc/caddy:ro
      - ./src/client/dist:/srv:ro
    ports:
      - "8081:80"
